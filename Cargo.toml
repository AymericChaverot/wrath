[package]
name = "wrath"
version = "0.1.0"
edition = "2021"
description = "A CLI tool to annihilate any process by name or port"
license = "MIT"

[dependencies]
clap = { version = "4.5.60", features = ["derive"] }
sysinfo = "0.38.3"
ureq = { version = "3.2.0", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
